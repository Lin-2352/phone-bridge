name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pinned: a new stable's lints must not turn CI red on unchanged code.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android:
    # Kotlin compile + lint against bindings generated from this commit (the
    # native library itself is built locally with cargo-ndk).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: cargo build -p pb-ffi
      - run: cargo run -q -p uniffi-bindgen -- generate --library target/debug/libpb_ffi.so --language kotlin --out-dir android/app/src/main/java
      - run: bash gradlew :app:compileReleaseKotlin :app:lintRelease --no-daemon --console=plain
        working-directory: android

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
