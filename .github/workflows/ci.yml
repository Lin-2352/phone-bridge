name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pinned: a new stable's lints must not turn CI red on unchanged code.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master on 2026-11-05
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android:
    # Kotlin compile + lint against bindings generated from this commit (the
    # native library itself is built locally with cargo-ndk).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master on 2026-11-05
        with:
          toolchain: "1.99.1"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - run: cargo build -p pb-ffi
      - run: cargo run -q -p uniffi-bindgen -- generate --library target/debug/libpb_ffi.so --language kotlin --out-dir android/app/src/main/java
      - run: bash gradlew :app:compileReleaseKotlin :app:lintRelease --no-daemon --console=plain
        working-directory: android

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Every action is pinned to a commit: a tag can be moved to other code.
      - run: bash scripts/check-pinned-actions.sh .github/workflows
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
