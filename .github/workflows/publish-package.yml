name: publish package

# Copies a release's files to GitHub Packages as an OCI artifact, because
# Packages has no type for plain files. The release page stays the place to
# download from; this is for pulling a version with `oras`.
#
# Two jobs, so each holds only the permission it needs: the download job can
# read the repository's releases but cannot write packages; the push job can
# write packages but never runs a download or any script from the release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v0.2.0
        required: true

# Nothing by default; each job asks for its own.
permissions: {}

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
      - name: The release must hold files and no folders
        run: |
          test -n "$(ls -A assets)" || { echo "the release has no files"; exit 1; }
          test -z "$(find assets -mindepth 1 -type d)" || { echo "unexpected folder in the release"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: assets/*
          if-no-files-found: error
          retention-days: 1

  push:
    needs: download
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      REGISTRY_TOKEN: ${{ github.token }}
    steps:
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: assets
      - name: Push to ghcr.io
        working-directory: assets
        run: |
          echo "$REGISTRY_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          files=()
          for f in *; do files+=("$f:application/octet-stream"); done
          oras push "ghcr.io/$owner/relay:${TAG#v}" \
            --artifact-type application/vnd.relay.release \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.description=Relay $TAG: Windows and Android builds" \
            --annotation "org.opencontainers.image.licenses=MIT OR Apache-2.0" \
            "${files[@]}"
