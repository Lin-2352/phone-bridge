[package]
name = "iroh-spike"
description = "Throwaway Phase 0 spike: iroh QUIC connectivity, throughput and latency on Windows and Android. Not shipped."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "sync"] }
n0-error = "1"
sha2 = "0.10"
rand = "0.9"
