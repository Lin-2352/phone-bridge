[package]
name = "ffi-smoke"
description = "Throwaway Phase 0 spike: iroh + UniFFI inside a real Android app. Not shipped."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# FFI needs `unsafe` (JNI), so this crate does not inherit the workspace
# `forbid`; it denies unsafe everywhere except the audited `android_init` module.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[lib]
name = "pb_smoke"
crate-type = ["cdylib"]

[dependencies]
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
iroh-spike = { path = "../iroh-spike" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
uniffi = { version = "0.32", features = ["tokio"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
