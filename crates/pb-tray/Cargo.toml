[package]
name = "pb-tray"
description = "Phone Bridge Windows tray app (Win32, no WebView)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Win32 UI needs `unsafe`; confined to the `ui` module with SAFETY comments.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[[bin]]
name = "pb-tray"
path = "src/main.rs"

[dependencies]
pb-identity = { path = "../pb-identity" }
pb-protocol = { path = "../pb-protocol" }
pb-transport = { path = "../pb-transport" }
pb-platform-win = { path = "../pb-platform-win" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net", "io-util"] }
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
rqrr = { version = "0.11", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell_Common", "Win32_System_DataExchange", "Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "ApplicationModel", "ApplicationModel_Activation", "ApplicationModel_DataTransfer", "ApplicationModel_DataTransfer_ShareTarget", "Foundation", "Foundation_Collections", "Storage"] }

[build-dependencies]
embed-resource = "3"
