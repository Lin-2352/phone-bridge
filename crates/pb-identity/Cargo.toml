[package]
name = "pb-identity"
description = "Phone Bridge device identity: Ed25519 keys, pinned peers, short authentication strings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ed25519-dalek = "2"
sha2 = "0.10"
getrandom = "0.3"
# Keyed discovery (M7.5): the pair key is HKDF-SHA256 over an X25519 shared secret; packets carry HMAC-SHA256.
hkdf = "0.12"
hmac = "0.12"
zeroize = "1"

[features]
# Exposes private parsers to the fuzz targets in tools/fuzz/; never in a build users get.
fuzzing = []
