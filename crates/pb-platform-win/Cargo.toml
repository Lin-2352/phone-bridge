[package]
name = "pb-platform-win"
description = "Windows platform glue for Phone Bridge (DPAPI seed protection; later clipboard, tray)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Win32 FFI needs `unsafe`; every block carries a SAFETY comment.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[dependencies]
unsafe-libopus = "0.2"
pb-identity = { path = "../pb-identity" }
pb-protocol = { path = "../pb-protocol" }
png = "0.18"

[target.'cfg(windows)'.dependencies.cpal]
version = "0.15"

[target.'cfg(windows)'.dependencies.tokio]
version = "1"
features = ["rt", "sync"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Foundation", "Security_Credentials_UI", "Win32_System_WinRT"] }
# The async type of the Hello verifier (already in the lock file through `windows`).
windows-future = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
