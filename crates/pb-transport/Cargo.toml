[package]
name = "pb-transport"
description = "Phone Bridge transport: iroh QUIC node, pairing and authenticated sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
pb-identity = { path = "../pb-identity" }
pb-protocol = { path = "../pb-protocol" }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "fs", "io-util", "net"] }
sha2 = "0.10"
getrandom = "0.3"
prost = "0.14"
fs4 = { version = "0.13", default-features = false, features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
