[package]
name = "pb-transport"
description = "Phone Bridge transport: iroh QUIC node, pairing and authenticated sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
pb-identity = { path = "../pb-identity" }
pb-protocol = { path = "../pb-protocol" }
pb-video = { path = "../pb-video" }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
# Congestion controller configs (same version iroh uses; nothing new to fetch).
noq-proto = { version = "=1.3.0", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "fs", "io-util", "net"] }
sha2 = "0.10"
getrandom = "0.3"
prost = "0.14"
fs4 = { version = "0.13", default-features = false, features = ["sync"] }

# Interface prefix lengths for discovery broadcasts. The exact versions iroh's
# netwatch already uses per target (nothing new to fetch).
[target.'cfg(windows)'.dependencies]
netdev = "=0.45.1"

[target.'cfg(not(windows))'.dependencies]
netdev = "=0.46.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[features]
# Exposes private parsers to the fuzz targets in fuzz/; never in a build users get.
fuzzing = []
