[package]
name = "pb-ffi"
description = "UniFFI bindings for the Phone Bridge Android app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# JNI needs `unsafe`; it is confined to the `android_init` module.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[lib]
name = "pb_ffi"
crate-type = ["cdylib"]

[dependencies]
pb-identity = { path = "../pb-identity" }
pb-protocol = { path = "../pb-protocol" }
pb-transport = { path = "../pb-transport" }
pb-video = { path = "../pb-video" }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
sha2 = "0.10"
uniffi = { version = "0.32", features = ["tokio"] }
# UniFFI runs async calls on async-compat's runtime; without this feature it
# is a single thread for everything (TOKIO_WORKER_THREADS=2 was ignored).
async-compat = { version = "0.2.6", features = ["multi-thread"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
