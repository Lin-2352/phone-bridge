[workspace]
resolver = "2"
members = [
    "crates/pb-identity",
    "crates/pb-protocol",
    "crates/pb-transport",
    "crates/pb-cli",
    "crates/pb-ffi",
    "crates/pb-platform-win",
    "crates/pb-tray",
    "crates/pb-video",
    "crates/pb-camera-frames",
    "crates/pb-camera-source",
    "spikes/iroh-spike",
    "spikes/ffi-smoke",
    "spikes/wifidirect-win",
    "tools/uniffi-bindgen",
    "tools/pb-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lin-2352/phone-bridge"
rust-version = "1.91"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Fast-compiling optimised profile for spikes and measurements.
[profile.spike]
inherits = "release"
lto = false
codegen-units = 16
panic = "unwind"

# Same as `spike` but with abort-on-panic, like `release`: proves Android works
# once the JNI context is installed and does not rely on unwinding.
[profile.spike-abort]
inherits = "spike"
panic = "abort"

# Android library: smallest code (less memory mapped per process) at full LTO.
[profile.android]
inherits = "release"
opt-level = "s"
