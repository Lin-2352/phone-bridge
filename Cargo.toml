[workspace]
resolver = "2"
members = [
    "crates/pb-identity",
    "crates/pb-protocol",
    "crates/pb-transport",
    "spikes/iroh-spike",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lin-2352/phone-bridge"
rust-version = "1.91"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Fast-compiling optimised profile for spikes and measurements.
[profile.spike]
inherits = "release"
lto = false
codegen-units = 16
panic = "unwind"
